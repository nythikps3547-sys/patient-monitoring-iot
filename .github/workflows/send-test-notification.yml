
name: PatientCare Multi-Device Test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: python -m pip install google-auth requests

      - name: Send test to all registered devices
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FCM_TOKENS: ${{ secrets.FCM_TOKENS }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          raw = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "")
          tokens = list(dict.fromkeys(
              line.strip()
              for line in os.environ.get("FCM_TOKENS", "").splitlines()
              if line.strip()
          ))

          if not raw or not tokens:
              sys.exit("Missing service-account secret or FCM_TOKENS.")

          try:
              info = json.loads(raw)
              project = info["project_id"]
              credentials = service_account.Credentials.from_service_account_info(
                  info,
                  scopes=["https://www.googleapis.com/auth/firebase.messaging"]
              )
              credentials.refresh(Request())
          except Exception as error:
              sys.exit("Could not load sender credentials: " + str(error))

          success = 0
          failed = 0

          for number, token in enumerate(tokens, start=1):
              response = requests.post(
                  f"https://fcm.googleapis.com/v1/projects/{project}/messages:send",
                  headers={
                      "Authorization": f"Bearer {credentials.token}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "message": {
                          "token": token,
                          "notification": {
                              "title": "PatientCare test",
                              "body": "Multi-device notification test."
                          }
                      }
                  },
                  timeout=30
              )

              if response.ok:
                  success += 1
                  print(f"Device entry {number}: accepted by FCM.")
              else:
                  failed += 1
                  try:
                      error = response.json().get("error", {})
                      status = error.get("status", "UNKNOWN")
                      details = error.get("details", [])
                      codes = [
                          item.get("errorCode", "")
                          for item in details
                          if isinstance(item, dict)
                      ]
                      print(
                          f"Device entry {number}: HTTP {response.status_code}; "
                          f"{status}; {','.join(codes)}"
                      )
                  except Exception:
                      print(f"Device entry {number}: HTTP {response.status_code}.")

          print(f"Accepted: {success}; failed: {failed}; total: {len(tokens)}")
          if failed:
              sys.exit(1)
          PY
